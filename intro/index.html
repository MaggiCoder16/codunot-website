<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codunot AI - Intro</title>
  <link rel="icon" type="image/x-icon" href="../favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/icons/favicon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon.png" />
  <meta name="description" content="An interactive introduction to Codunot AI, the best Discord bot." />
  <style>
    :root {
      color-scheme: dark;
      --bg: #020202;
      --text: #ffffff;
      --muted: rgba(255, 255, 255, .72);
      --glass: rgba(255, 255, 255, .08);
      --glass-strong: rgba(255, 255, 255, .16);
      --line: rgba(255, 255, 255, .22);
      --logo: url("https://cdn.top.gg/icons/799571124189618176/041c2d0d7f2919cb19e56f2e1f8a0d79e7dc9940f870adf07feab99dd3ce0a04.webp");
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      cursor: none;
    }

    .intro-app {
      position: relative;
      min-height: 100dvh;
      isolation: isolate;
      background:
        radial-gradient(circle at 50% 100%, rgba(255,255,255,.07), transparent 42%),
        linear-gradient(180deg, #050505 0%, #000 100%);
    }

    .orb {
      position: fixed;
      width: clamp(150px, 22vw, 340px);
      aspect-ratio: 1;
      border-radius: 999px;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,.84), rgba(255,255,255,.22) 34%, transparent 68%);
      filter: blur(14px);
      opacity: .34;
      pointer-events: none;
      animation: floatOrb 16s ease-in-out infinite alternate;
      z-index: -1;
    }

    .orb.one { left: 7vw; top: 12vh; }
    .orb.two { right: 10vw; bottom: 8vh; width: clamp(100px, 15vw, 240px); animation-delay: -7s; opacity: .24; }

    @keyframes floatOrb {
      from { transform: translate3d(-2vw, 4vh, 0) scale(.9); }
      to { transform: translate3d(8vw, -7vh, 0) scale(1.16); }
    }

    .cursor-glow {
      position: fixed;
      left: 0;
      top: 0;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 20;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(255,255,255,.88), rgba(255,255,255,.24) 32%, transparent 72%);
      mix-blend-mode: screen;
      filter: blur(2px);
      opacity: .9;
    }

    .back-button {
      position: fixed;
      top: clamp(18px, 4vw, 34px);
      left: clamp(18px, 4vw, 34px);
      z-index: 10;
      border: 1px solid var(--line);
      color: var(--text);
      background: rgba(255,255,255,.06);
      backdrop-filter: blur(18px);
      border-radius: 999px;
      padding: .75rem 1rem;
      font-weight: 800;
      letter-spacing: .02em;
      cursor: none;
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity .35s ease, transform .35s ease, background .2s ease;
    }

    .back-button.visible { opacity: 1; transform: translateY(0); }
    .back-button:hover { background: rgba(255,255,255,.14); }

    .page {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: clamp(24px, 6vw, 72px);
      opacity: 0;
      transform: scale(1.02);
      filter: blur(18px);
      pointer-events: none;
      transition: opacity .9s ease, transform .9s ease, filter .9s ease;
    }

    .page.active {
      opacity: 1;
      transform: scale(1);
      filter: blur(0);
      pointer-events: auto;
    }

    .center { text-align: center; }
    .above-center { align-self: start; margin-top: 15vh; text-align: center; }

    h1, h2, p { margin: 0; }

    .hero-title {
      font-size: clamp(3.5rem, 11vw, 10rem);
      line-height: .92;
      font-weight: 950;
      letter-spacing: -.08em;
      text-shadow: 0 0 42px rgba(255,255,255,.28);
    }

    .subtitle {
      margin-top: 1rem;
      font-size: clamp(1.3rem, 3vw, 2.8rem);
      color: var(--muted);
      font-weight: 800;
      letter-spacing: .03em;
    }

    .logo {
      width: clamp(120px, 20vw, 230px);
      height: clamp(120px, 20vw, 230px);
      border-radius: 36px;
      object-fit: cover;
      box-shadow: 0 0 70px rgba(255,255,255,.3), 0 24px 80px rgba(0,0,0,.9);
      animation: logoFloat 4s ease-in-out infinite alternate;
    }

    @keyframes logoFloat { to { transform: translateY(-16px) rotate(1deg); } }

    .typed, .statement {
      max-width: 980px;
      margin-top: 2rem;
      font-size: clamp(1.6rem, 4vw, 4.2rem);
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: -.045em;
    }

    .typed::after {
      content: "";
      display: inline-block;
      width: .08em;
      height: .9em;
      margin-left: .08em;
      background: white;
      vertical-align: -.08em;
      animation: blink .75s steps(1) infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    .core-trigger {
      position: absolute;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(255,255,255,.34);
      border-radius: 26px;
      padding: 2rem 4rem;
      background: linear-gradient(135deg, rgba(255,255,255,.2), rgba(255,255,255,.045));
      color: white;
      font-size: clamp(1.5rem, 3vw, 3rem);
      font-weight: 950;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 0 80px rgba(255,255,255,.18);
      backdrop-filter: blur(22px);
      cursor: none;
      transition: transform .2s ease, filter .2s ease;
    }

    .core-trigger:hover { transform: translate(-50%, -50%) scale(1.04); filter: brightness(1.12); }
    .core-trigger.shattered { opacity: 0; pointer-events: none; }

    .shard {
      position: fixed;
      width: 34px;
      height: 28px;
      background: linear-gradient(135deg, rgba(255,255,255,.85), rgba(255,255,255,.05));
      border: 1px solid rgba(255,255,255,.28);
      clip-path: polygon(8% 0, 100% 18%, 72% 100%, 0 78%);
      z-index: 8;
      animation: shardFly .95s cubic-bezier(.17,.84,.44,1) forwards;
    }

    @keyframes shardFly {
      to { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(.2); opacity: 0; filter: blur(3px); }
    }

    .features-map {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity .8s ease .25s;
    }

    .features-map.visible { opacity: 1; pointer-events: auto; }

    .core-center {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .core-center .logo { width: 110px; height: 110px; border-radius: 26px; }
    .core-center h2 { margin-top: 1rem; font-size: clamp(1.7rem, 3vw, 3.4rem); }

    .branch {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(32vw, 420px);
      height: 1px;
      background: linear-gradient(90deg, rgba(255,255,255,.75), transparent);
      transform-origin: 0 50%;
      opacity: .55;
    }

    .branch.tl { transform: rotate(225deg); }
    .branch.tr { transform: rotate(315deg); }
    .branch.bl { transform: rotate(135deg); }
    .branch.br { transform: rotate(45deg); }

    .feature-box {
      position: absolute;
      width: min(38vw, 260px);
      min-height: 150px;
      display: grid;
      place-items: center;
      text-align: center;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 28px;
      background: rgba(255,255,255,.075);
      box-shadow: 0 24px 90px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.24);
      backdrop-filter: blur(22px);
      font-size: clamp(1.1rem, 2vw, 1.8rem);
      font-weight: 950;
      cursor: none;
      transition: transform .6s cubic-bezier(.2,.9,.15,1), opacity .5s ease, width .6s ease, min-height .6s ease, border-radius .6s ease;
    }

    .feature-box:hover { transform: scale(1.06); }
    .feature-box.one { left: clamp(24px, 9vw, 120px); top: clamp(92px, 14vh, 150px); }
    .feature-box.two { right: clamp(24px, 9vw, 120px); top: clamp(92px, 14vh, 150px); opacity: .52; }
    .feature-box.three { left: clamp(24px, 9vw, 120px); bottom: clamp(32px, 12vh, 120px); opacity: .52; }
    .feature-box.four { right: clamp(24px, 9vw, 120px); bottom: clamp(32px, 12vh, 120px); opacity: .52; }

    .features-map.detail .feature-box:not(.selected), .features-map.detail .core-center, .features-map.detail .branch { opacity: 0; pointer-events: none; }

    .feature-box.selected {
      left: 50%;
      top: 50%;
      right: auto;
      bottom: auto;
      transform: translate(-50%, -50%);
      width: min(92vw, 980px);
      min-height: min(70vh, 560px);
      padding: clamp(24px, 5vw, 52px);
      place-items: stretch;
      text-align: left;
      border-radius: 34px;
      cursor: default;
      z-index: 6;
    }

    .feature-detail { display: none; color: var(--muted); font-weight: 650; }
    .feature-box.selected .feature-detail { display: block; }
    .feature-box.selected .feature-title { display: block; font-size: clamp(2.2rem, 5vw, 4.6rem); color: white; margin-bottom: 1rem; }
    .detail-copy { font-size: clamp(1rem, 2vw, 1.35rem); line-height: 1.55; max-width: 780px; }
    .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; margin-top: 2rem; }
    .detail-card { border: 1px solid rgba(255,255,255,.16); border-radius: 22px; padding: 1.2rem; background: rgba(0,0,0,.24); }
    .detail-card h3 { margin: 0 0 .8rem; color: white; }
    .chips { display: flex; flex-wrap: wrap; gap: .6rem; }
    .chip { border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: .55rem .8rem; color: white; background: rgba(255,255,255,.08); }

    .click-hint {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,.5);
      font-size: .9rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      z-index: 9;
    }

    @media (max-width: 760px) {
      body { cursor: auto; }
      .cursor-glow { display: none; }
      .back-button, .core-trigger, .feature-box { cursor: pointer; }
      .detail-grid { grid-template-columns: 1fr; }
      .branch { width: 35vw; }
      .feature-box { min-height: 118px; }
      .feature-box.selected { min-height: 78vh; overflow: auto; }
    }
  </style>
</head>
<body>
  <main class="intro-app" aria-live="polite">
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="cursor-glow" aria-hidden="true"></div>
    <button class="back-button" type="button" aria-label="Go back one intro page">← Back</button>

    <section class="page active" data-page="0">
      <div class="center">
        <h1 class="hero-title">Codunot AI</h1>
        <p class="subtitle">Best Discord Bot</p>
      </div>
    </section>

    <section class="page" data-page="1">
      <div class="center">
        <img class="logo" src="https://cdn.top.gg/icons/799571124189618176/041c2d0d7f2919cb19e56f2e1f8a0d79e7dc9940f870adf07feab99dd3ce0a04.webp" alt="Codunot logo" />
        <p class="typed" data-text="Hi, I'm Codunot!"></p>
      </div>
    </section>

    <section class="page" data-page="2">
      <div class="center">
        <img class="logo" src="https://cdn.top.gg/icons/799571124189618176/041c2d0d7f2919cb19e56f2e1f8a0d79e7dc9940f870adf07feab99dd3ce0a04.webp" alt="Codunot logo" />
        <p class="statement">I'm a feature rich, all-in-one discord bot, built for all kinds of communities to make them more engaging.</p>
      </div>
    </section>

    <section class="page" data-page="3">
      <div class="above-center">
        <p class="statement">I have a lot of features. Wanna know my core features? :&gt;</p>
      </div>
      <button class="core-trigger" type="button">Core features</button>
      <div class="features-map" aria-label="Codunot core features">
        <span class="branch tl"></span><span class="branch tr"></span><span class="branch bl"></span><span class="branch br"></span>
        <div class="core-center">
          <img class="logo" src="https://cdn.top.gg/icons/799571124189618176/041c2d0d7f2919cb19e56f2e1f8a0d79e7dc9940f870adf07feab99dd3ce0a04.webp" alt="Codunot logo" />
          <h2>Core Features</h2>
        </div>
        <button class="feature-box one" type="button">
          <span class="feature-title">AI Chatbot</span>
          <span class="feature-detail">
            <span class="detail-copy">You can chat with me! I have many personality modes, and many chatting models!</span>
            <span class="detail-grid">
              <span class="detail-card"><h3>Personality modes</h3><span class="chips"><span class="chip">Fun</span><span class="chip">Serious</span><span class="chip">Roast</span><span class="chip">Teach Me Rizz</span><span class="chip">Chess</span></span></span>
              <span class="detail-card"><h3>Chatting models</h3><span class="chips"><span class="chip">GPT-OSS-120B</span><span class="chip">CoduChat V1</span><span class="chip">CoduChat V2</span><span class="chip">Qwen3 32B</span><span class="chip">Llama 3.3 70B Versatile</span><span class="chip">Llama 4 Scout 17B 16E</span></span></span>
            </span>
          </span>
        </button>
        <div class="feature-box two">Music</div>
        <div class="feature-box three">Moderation</div>
        <div class="feature-box four">Media Tools</div>
      </div>
    </section>
    <div class="click-hint">Click to continue</div>
  </main>

  <script>
    const pages = [...document.querySelectorAll('.page')];
    const backButton = document.querySelector('.back-button');
    const cursorGlow = document.querySelector('.cursor-glow');
    const typedLine = document.querySelector('.typed');
    const coreTrigger = document.querySelector('.core-trigger');
    const featuresMap = document.querySelector('.features-map');
    const aiBox = document.querySelector('.feature-box.one');
    let currentPage = 0;
    let typingTimer;
    let locked = true;

    function showPage(index) {
      currentPage = Math.max(0, Math.min(index, pages.length - 1));
      pages.forEach((page, pageIndex) => page.classList.toggle('active', pageIndex === currentPage));
      backButton.classList.toggle('visible', currentPage > 0);
      document.querySelector('.click-hint').textContent = currentPage === 0 ? 'Starting...' : 'Click to continue';
      if (currentPage === 1) typeText();
      locked = currentPage === 0;
    }

    function typeText() {
      clearInterval(typingTimer);
      const text = typedLine.dataset.text;
      let index = 0;
      typedLine.textContent = '';
      typingTimer = setInterval(() => {
        typedLine.textContent = text.slice(0, index++);
        if (index > text.length) clearInterval(typingTimer);
      }, 72);
    }

    function makeShards() {
      const rect = coreTrigger.getBoundingClientRect();
      for (let i = 0; i < 46; i++) {
        const shard = document.createElement('span');
        shard.className = 'shard';
        shard.style.left = `${rect.left + Math.random() * rect.width}px`;
        shard.style.top = `${rect.top + Math.random() * rect.height}px`;
        shard.style.setProperty('--tx', `${(Math.random() - .5) * window.innerWidth * 1.4}px`);
        shard.style.setProperty('--ty', `${(Math.random() - .5) * window.innerHeight * 1.2}px`);
        shard.style.setProperty('--rot', `${(Math.random() - .5) * 900}deg`);
        document.body.appendChild(shard);
        shard.addEventListener('animationend', () => shard.remove());
      }
    }

    function openCoreMap(event) {
      event.stopPropagation();
      coreTrigger.classList.add('shattered');
      makeShards();
      setTimeout(() => featuresMap.classList.add('visible'), 360);
    }

    function openAiDetail(event) {
      event.stopPropagation();
      featuresMap.classList.add('detail');
      aiBox.classList.add('selected');
      document.querySelector('.click-hint').textContent = 'Click outside the box to go back';
    }

    function closeAiDetail() {
      featuresMap.classList.remove('detail');
      aiBox.classList.remove('selected');
      document.querySelector('.click-hint').textContent = 'Click to continue';
    }

    window.addEventListener('mousemove', (event) => {
      cursorGlow.style.left = `${event.clientX}px`;
      cursorGlow.style.top = `${event.clientY}px`;
    });

    document.addEventListener('click', (event) => {
      if (event.target.closest('.back-button, .core-trigger, .feature-box.selected, .feature-box.one')) return;
      if (aiBox.classList.contains('selected')) return closeAiDetail();
      if (locked || currentPage >= pages.length - 1) return;
      showPage(currentPage + 1);
    });

    backButton.addEventListener('click', (event) => {
      event.stopPropagation();
      if (aiBox.classList.contains('selected')) return closeAiDetail();
      if (currentPage > 0) showPage(currentPage - 1);
    });

    coreTrigger.addEventListener('click', openCoreMap);
    aiBox.addEventListener('click', openAiDetail);

    setTimeout(() => showPage(1), 3000);
  </script>
</body>
</html>
